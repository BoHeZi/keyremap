name = "默认配置"

# 托盘菜单里"Web 配置工具"打开的地址。留空则用仓库自带的 GitHub Pages 部署。
# 自己部署到别处 (比如 Cloudflare Pages) 时改这里。
# web_url = "https://my-keyremap.pages.dev/"

# 单键映射: from = "..." / to = "..."
# 输出组合键: to 写成数组, 例如 to = ["Ctrl", "W"]
# 输入组合键: from 写成数组, 最后一个是触发键, 前面是要按住的修饰键,
#             例如 from = ["Ctrl", "E"] 表示"按住 Ctrl 再按 E"
#             修饰键只能是 Ctrl / Shift / Alt / Win, 不分左右
#
# 用 `keyremap --listen` 查看按下的键叫什么名字 (托盘菜单里也有入口)。
# 用 `keyremap --dump-keys` 列出全部可用键名。

# 组开关。整段可选 —— 这里没列出的组默认启用,
# 所以只想分组、不想预设开关时可以完全不写这一段。
# 托盘菜单里也能临时切换 (只改内存, 不写回本文件)。
[groups]
"文本编辑" = false

# ---- 未分组: 不写 group 字段的映射都归到这里 ----

[[mappings]]
name = "Pause转Insert"
comment = "把不常用的 Pause 键变成 Insert"
from = "Pause"
to = "Insert"

# ---- 组不需要预先声明, 写了 group 就有 ----

[[mappings]]
name = "关闭标签页"
comment = "鼠标前进键关闭当前标签页"
group = "浏览器"
from = "MouseX2"
to = ["Ctrl", "W"]

# ---- 下面这组在上面的 [groups] 里被整组关掉了 ----
# 托盘菜单中打开"文本编辑"组即可让组内各条一起生效

[[mappings]]
name = "D转E"
group = "文本编辑"
from = "D"
to = "E"

[[mappings]]
name = "E转D"
group = "文本编辑"
from = "E"
to = "D"

# ---- 组合键作为输入源 ----
# 长按会连发, 所以适合 Backspace / 方向键这类需要连续触发的目标。
# 注意: 触发时 keyremap 会先松开 Ctrl 再发 Backspace, 否则应用收到的
# 会是 Ctrl+Backspace (多数编辑器会删掉一整个词)。

[[mappings]]
name = "Ctrl+E转Backspace"
comment = "手不用离开主键区就能删字"
group = "文本编辑"
from = ["Ctrl", "E"]
to = "Backspace"

# ---- 屏蔽: to = [] 表示吞掉输入, 什么都不发出 ----

[[mappings]]
name = "防手滑关标签页"
comment = "Ctrl+W 被屏蔽掉"
group = "浏览器"
enable = false               # 想用的话把这行删掉
from = ["Ctrl", "W"]
to = []

# ---- CapsLock 当修饰键 ----
# 按住期间不会切换大小写 (它的按下事件被吞掉了)。
# 单独轻点会怎样, 取决于有没有为 CapsLock 单独配映射:
#   没配                  -> 照常切换大小写
#   配 to = []            -> 什么都不做, 这才是"禁用 CapsLock"
#   配 to = "Esc" (如下)  -> 发 Esc, 即"轻点是 Esc、按住是修饰键"

[[mappings]]
name = "CapsLock转方向键"
group = "文本编辑"
from = ["CapsLock", "H"]
to = "Left"

[[mappings]]
name = "轻点CapsLock发Esc"
group = "文本编辑"
from = "CapsLock"
to = "Esc"

# 上面两条互为反向映射, 同时启用也不会死循环:
# 注入的按键带有标记, 钩子识别后会直接放行, 不会再次匹配。
