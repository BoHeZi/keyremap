name: Release

on:
  push:
    tags:
      - "v*"

# 新建 Release 需要写权限, 新版 GitHub 默认只给只读
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 版本号存在三处: git tag、Cargo.toml、assets/app.rc (编进 app.res)。
      #
      # 这里只**校验**不改写。参考项目是在流水线里把 tag 写回 Cargo.toml 的,
      # 但那一招在本项目会出错: app.res 是预编译提交的二进制, 流水线改了
      # Cargo.toml 也动不了它, 结果发出去的 exe 文件属性还是旧版本号。
      # 与其发一个自相矛盾的包, 不如在这里拦住, 要求发版前先本地对齐三处。
      - name: Check tag matches Cargo.toml
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          if (-not $line) { throw "Cargo.toml 里找不到 version 行" }
          $toml = $line.Matches[0].Groups[1].Value
          if ($tag -ne $toml) {
            throw "tag ($tag) 与 Cargo.toml ($toml) 不一致。发版前请更新 Cargo.toml 和 assets/app.rc, 再跑 assets/build-res.ps1 重新生成 app.res"
          }
          "version=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "版本: $tag"

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # app.res 忘了重新生成的话, 到这里才会暴露 —— exe 的文件属性对不上 tag
      - name: Check exe version resource
        shell: pwsh
        run: |
          $exeVer = (Get-Item target\release\keyremap.exe).VersionInfo.FileVersion
          if (-not $exeVer) { throw "exe 里没有版本资源, app.res 可能没链接上" }
          if ($exeVer -ne "${{ steps.version.outputs.version }}") {
            throw "exe 版本资源 ($exeVer) 与 tag 不一致 —— 改了 assets/app.rc 之后要跑 assets/build-res.ps1"
          }
          Write-Output "exe 版本资源: $exeVer"

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 压缩包里**不套一层目录**。scoop 是直接解压到应用目录的, 多一层壳就得靠
          # 清单里的 extract_dir, 而那个值带版本号 —— 自动更新的清单维护不了它。
          Compress-Archive -Force `
            -Path target\release\keyremap.exe,keyremap.toml,README.md,LICENSE `
            -DestinationPath "dist\keyremap-$ver-windows-x86_64.zip"
          Get-ChildItem dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  # 通知自己的 scoop 仓库更新清单。对端会自己去下载资产算 sha256,
  # 所以这里不传哈希, 也就不存在两边算法或时序不一致的问题。
  notify-scoop-bucket:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scoop.json
          sparse-checkout-cone-mode: false

      - name: Read scoop.json
        id: scoop
        run: |
          set -euo pipefail
          for key in name bin description homepage license; do
            echo "$key=$(jq -er ".$key" .github/scoop.json)" >> "$GITHUB_OUTPUT"
          done

      - name: Send repository_dispatch to scoop-bucket
        env:
          VERSION: ${{ needs.release.outputs.version }}
          APP: ${{ steps.scoop.outputs.name }}
          ASSET_NAME: "${{ steps.scoop.outputs.name }}-${{ needs.release.outputs.version }}-windows-x86_64.zip"
          # 两个名字都认: 本仓库现有的是 SCOOP_TOKEN, 姊妹项目用的是
          # SCOOP_BUCKET_GITHUB_TOKEN。少一个二选一的配置步骤。
          TOKEN: ${{ secrets.SCOOP_TOKEN || secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 先明说缺什么。否则空 token 只会换来一个 401, 看不出是没配 secret
          if [ -z "$TOKEN" ]; then
            echo "::error::未配置 secret SCOOP_TOKEN (或 SCOOP_BUCKET_GITHUB_TOKEN)," \
                 "需要一个对 huanfeng/scoop-bucket 有 contents:write 权限的 PAT"
            exit 1
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/huanfeng/scoop-bucket/dispatches" \
            -d "$(jq -n \
              --arg app "$APP" \
              --arg repo "${{ github.repository }}" \
              --arg version "$VERSION" \
              --arg asset_name "$ASSET_NAME" \
              --arg bin "${{ steps.scoop.outputs.bin }}" \
              --arg description "${{ steps.scoop.outputs.description }}" \
              --arg homepage "${{ steps.scoop.outputs.homepage }}" \
              --arg license "${{ steps.scoop.outputs.license }}" \
              '{
                event_type: "update-scoop-manifest",
                client_payload: {
                  app: $app,
                  repo: $repo,
                  version: $version,
                  asset_name: $asset_name,
                  bin: $bin,
                  description: $description,
                  homepage: $homepage,
                  license: $license
                }
              }'
            )"
