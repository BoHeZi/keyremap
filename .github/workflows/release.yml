name: Release

on:
  push:
    tags:
      - "v*"

# 新建 Release 需要写权限, 新版 GitHub 默认只给只读
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $name = "keyremap-ng-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target\release\keyremap-ng.exe,keyremap.toml,README.md,LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          Get-ChildItem "$name.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
