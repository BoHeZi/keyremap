[package]
name = "keyremap-ng"
version = "0.1.0"
edition = "2024"
description = "Windows 键盘/鼠标重映射工具"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1
# panic=abort 对钩子回调是有利的: panic 跨 FFI 边界属于未定义行为,
# 直接 abort 比放任 unwind 穿过 Windows 的调用栈安全。
panic = "abort"
