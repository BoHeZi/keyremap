name = "默认配置"

# 单键映射: 写成 from = "..." / to = "..."
# 组合键映射: to 写成数组, 例如 to = ["Ctrl", "W"]
#
# 用 `keyremap-ng --listen` 可以查看按下的键叫什么名字。
# 用 `keyremap-ng --dump-keys` 可以列出全部可用键名。

[[mappings]]
name = "Pause转Insert"
comment = "把不常用的 Pause 键变成 Insert"
from = "Pause"
to = "Insert"

[[mappings]]
name = "鼠标侧键转Ctrl+W"
comment = "鼠标前进键关闭当前标签页"
from = "MouseX2"
to = ["Ctrl", "W"]

# 下面两条互为反向映射。两条同时启用也不会死循环:
# 注入的按键带有标记, 钩子识别后会直接放行, 不会再次匹配。
# (这里默认关着只是因为 D/E 互换会让打字很痛苦)
[[mappings]]
name = "D转E"
enable = false
from = "D"
to = "E"

[[mappings]]
name = "E转D"
enable = false
from = "E"
to = "D"
